<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Esports Muhasebe</title><style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#141821;--line:#292f3b;--red:#e53945;--muted:#9ba4b5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f6fa;font:15px system-ui,Arial}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;background:var(--red);color:white;padding:11px 15px;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:24px}.brand{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.brand h1{margin:0;font-size:22px}.brand span{color:var(--red)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0}.card,section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.metric{font-size:26px;font-weight:800;margin-top:8px}.layout{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}input,select{width:100%;background:#0b0d12;border:1px solid var(--line);border-radius:8px;color:white;padding:11px}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}.login{max-width:420px;margin:10vh auto}.hidden{display:none}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.danger{background:#343b49}.positive{color:#58d68d}.negative{color:#ff7078}@media(max-width:720px){.grid,.layout{grid-template-columns:1fr}.wrap{padding:15px}table{font-size:12px}}
</style></head><body><main class="wrap"><header class="brand"><h1>◈ <span>ESPORTS</span> MUHASEBE</h1><div id="userbar" class="hidden"><small class="muted">Yönetici oturumu</small> <button class="danger" id="logout">Çıkış</button></div></header>
<section id="login" class="login"><h2>Güvenli giriş</h2><p class="muted">Muhasebe paneline devam etmek için giriş yap.</p><form id="loginform"><label>E-posta</label><input name="email" type="email" required autocomplete="username"><label>Parola</label><input name="password" type="password" required autocomplete="current-password"><p id="loginerr" class="negative"></p><button type="submit">Giriş yap</button></form></section>
<div id="app" class="hidden"><div class="grid"><div class="card"><div class="muted">Toplam gelir</div><div class="metric positive" id="income">₺0</div></div><div class="card"><div class="muted">Toplam gider</div><div class="metric negative" id="expense">₺0</div></div><div class="card"><div class="muted">Bakiye</div><div class="metric" id="balance">₺0</div></div></div>
<div class="layout"><section><h2>Hareket ekle</h2><form id="txform"><label>İşlem türü</label><select name="type"><option value="income">Gelir</option><option value="expense">Gider</option></select><label>Açıklama</label><input name="description" required maxlength="120" placeholder="Örn. Turnuva ödülü"><label>Tutar (₺)</label><input name="amount" type="number" min="0.01" step="0.01" required><label>Tarih</label><input name="date" type="date" required><button type="submit" style="margin-top:14px">İşlemi kaydet</button><p class="muted" id="status" role="status"></p></form></section>
<section><div class="row"><h2 style="margin:0">Son işlemler</h2><button class="danger" id="export">CSV dışa aktar</button></div><div style="overflow:auto"><table><thead><tr><th>Tarih</th><th>Tür</th><th>Açıklama</th><th>Tutar</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></div></div></main>
<script>
const $=s=>document.querySelector(s);let state={teams:[],transactions:[],notes:[],currency:"TRY"};const money=n=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY"}).format(n||0);
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"İstek başarısız");return d}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){$("#income").textContent=money(state.transactions.filter(x=>x.type==="income").reduce((a,x)=>a+Number(x.amount),0));$("#expense").textContent=money(state.transactions.filter(x=>x.type==="expense").reduce((a,x)=>a+Number(x.amount),0));$("#balance").textContent=money(state.transactions.reduce((a,x)=>a+(x.type==="income"?1:-1)*Number(x.amount),0));$("#rows").innerHTML=state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+(x.type==="income"?"Gelir":"Gider")+'</td><td>'+esc(x.description)+'</td><td class="'+(x.type==="income"?"positive":"negative")+'">'+money(x.amount)+'</td><td><button class="danger" data-del="'+x.id+'">Sil</button></td></tr>').join("")||'<tr><td colspan="5" class="muted">Henüz işlem yok.</td></tr>'}
async function save(){await api("/api/state",{method:"PUT",body:JSON.stringify(state)});render()}
async function start(){try{const s=await api("/api/session");if(s.authenticated){state=await api("/api/state");$("#login").classList.add("hidden");$("#app").classList.remove("hidden");$("#userbar").classList.remove("hidden");render()}}catch(e){console.error(e)}}
$("#loginform").addEventListener("submit",async e=>{e.preventDefault();$("#loginerr").textContent="";try{await api("/api/login",{method:"POST",body:JSON.stringify({email:e.target.email.value,password:e.target.password.value})});state=await api("/api/state");$("#login").classList.add("hidden");$("#app").classList.remove("hidden");$("#userbar").classList.remove("hidden");render()}catch(err){$("#loginerr").textContent=err.message}});
$("#logout").onclick=async()=>{await api("/api/logout",{method:"POST"});location.reload()};
$("#txform").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);state.transactions.push({id:crypto.randomUUID(),type:f.get("type"),description:f.get("description").trim(),amount:Number(f.get("amount")),date:f.get("date")});try{await save();e.target.reset();$("#status").textContent="Kayıt edildi."}catch(err){$("#status").textContent=err.message}});
$("#rows").addEventListener("click",async e=>{const id=e.target.dataset.del;if(!id)return;state.transactions=state.transactions.filter(x=>x.id!==id);try{await save()}catch(err){alert(err.message)}});
$("#export").onclick=()=>{const rows=[["Tarih","Tür","Açıklama","Tutar"],...state.transactions.map(x=>[x.date,x.type==="income"?"Gelir":"Gider",x.description,x.amount])];const csv="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="esports-muhasebe.csv";a.click();URL.revokeObjectURL(a.href)};
$("#txform").elements.date.value=new Date().toISOString().slice(0,10);start();
</script></body></html>
